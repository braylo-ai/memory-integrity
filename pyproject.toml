[project]
name = "memory-integrity"
version = "0.1.0"
description = "Agent long-term memory with per-fact provenance, poisoning and contradiction detection, and versioned rollback"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
